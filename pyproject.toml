[build-system]
requires = ["setuptools>=61", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "voicingtts-nanovllm"
dynamic = ["version"]
authors = [{ name = "Voicing AI" }]
classifiers = ["License :: OSI Approved :: MIT License"]
readme = "README.md"
description = "VoicingTTS inference engine based on Nano-vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5.0,!=2.6.*",
    "triton>=3.0.0; sys_platform != 'win32'",
    "triton-windows<3.5; sys_platform == 'win32'",
    "transformers>=4.51.0",
    "xxhash",
    "torchaudio",
    "tqdm",
    "numpy",
    "librosa",
    "pydantic",    
    "flash_attn ; sys_platform != 'win32'",
    "soundfile>=0.13.1",
    "torchcodec",
]

[project.urls]
Homepage="https://github.com/VoicingAI/voicingtts-nanovllm"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools_scm]
# Derive the package version from git tags.
# - Tags are currently prefixed with "v" (e.g. v1.0.0rc3); strip the prefix.
# - Use post-release scheme for commits after a tag, and keep local version info.
tag_regex = "^(?:v)?(?P<version>.*)$"
version_scheme = "post-release"
local_scheme = "node-and-date"
write_to = "voicingtts_nanovllm/_version.py"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["voicingtts_nanovllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "gpu: requires a real CUDA GPU (deselect with -m 'not gpu')",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  )/
'''

[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["voicingtts_nanovllm"]
omit = ["tests/*"]
dynamic_context = "test_function"

[tool.coverage.report]
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.paths]
source = [
    "voicingtts_nanovllm/",
    "/__w/voicingtts-nanovllm/voicingtts-nanovllm/voicingtts_nanovllm/",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests"]

[tool.mypy]
python_version = "3.10"

# Keep CI usable by avoiding third-party stub churn and excluding
# non-library entrypoints/tests from typechecking.
ignore_missing_imports = true
no_implicit_optional = false
exclude = "^tests/"

warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "voicingtts_nanovllm.layers.*",
    "voicingtts_nanovllm.models.voicingtts.*",
    "voicingtts_nanovllm.models.voicingtts2.*",
]
ignore_errors = true

[tool.uv.extra-build-dependencies]
flash-attn = [
    { requirement = "torch", match-runtime = true },
    "setuptools",
    "wheel",
    "psutil",
    "packaging",
    "ninja",
]


[dependency-groups]
dev = [
    "black==26.3.1",
    "diff-cover>=9,<10",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]
